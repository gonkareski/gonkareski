<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0867d8">
  <meta name="description" content="Официальное приложение гоночной команды Гонкарески">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Гонкарески — официальное приложение</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn back hidden" id="backBtn" aria-label="Назад">‹</button>
      <div class="brand" id="brandHome" role="button" tabindex="0">
        <img src="./icon.svg" alt="Гонкарески">
        <div>
          <strong><span>гон</span><b>карески</b></strong>
          <small>Смешнее, чем кажется</small>
        </div>
      </div>
      <button class="icon-btn" id="bellBtn" aria-label="Уведомления">♟</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button data-route="home"><span>⌂</span><small>Главная</small></button>
      <button data-route="news"><span>▤</span><small>Новости</small></button>
      <button data-route="shop"><span>▣</span><small>Магазин</small></button>
      <button data-route="support"><span>♡</span><small>Поддержать</small></button>
      <button data-route="profile"><span>♙</span><small>Профиль</small></button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <script src="./script.js"></script>
</body>
</html>
